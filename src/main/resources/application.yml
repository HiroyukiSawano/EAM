spring:
  application:
    name: asset-center
  servlet:
    multipart:
      max-file-size: ${FILE_STORAGE_MAX_FILE_SIZE:2MB}
      max-request-size: ${FILE_STORAGE_MAX_REQUEST_SIZE:2MB}
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  datasource:
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3307/eam?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    # H2 本地内存库示例（如需切回，将上面的 MySQL 配置替换为以下值）
    # driver-class-name: ${DB_DRIVER:org.h2.Driver}
    # url: ${DB_URL:jdbc:h2:mem:eam;MODE=MYSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    # username: ${DB_USERNAME:sa}
    # password: ${DB_PASSWORD:}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: ${FLYWAY_BASELINE_VERSION:3}
  jackson:
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

server:
  port: ${SERVER_PORT:8080}

asset-center:
  file-storage:
    base-dir: ${FILE_STORAGE_BASE_DIR:${user.dir}/data/uploads/images}
    public-base-path: ${FILE_STORAGE_PUBLIC_BASE_PATH:/api/v1/files/images}
    max-image-size-bytes: ${FILE_STORAGE_MAX_IMAGE_SIZE_BYTES:2097152}

springdoc:
  swagger-ui:
    enabled: false
